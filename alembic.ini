# =============================================================================
# Alembic Database Migration Configuration Blueprint
# =============================================================================
# Role: Manages schema evolution tracking, version control lineages, and
# state synchronization pipelines for the Cluj-Napoca Smart City relational ledger.
# =============================================================================

[alembic]
# Path to migration scripts directory containing env.py and version branches
script_location = migrations

# Append the current directory to sys.path to enable smooth resolution of local modules
prepend_sys_path = .

# Target backend connection URL.
# NOTE: In production, this static line is bypassed inside 'migrations/env.py'
# to dynamically inject values from system environment variables (DATABASE_URL) for security.
sqlalchemy.url = sqlite:///app.db


# =============================================================================
# Logging Infrastructure Configuration
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# --- Logger Instances Definitions ---

[logger_root]
# Root logger is set to WARN to minimize text noise during massive IoT ingestion cycles
level = WARN
handlers = console

[logger_sqlalchemy]
# Controls logging for the SQLAlchemy ORM engine internals.
# Switch level to INFO to output raw compiled SQL statements for query profiling.
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# High-priority logging for tracking structural migration executions and revision branching
level = INFO
handlers =
qualname = alembic


# --- Logger Handlers Definitions ---

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# --- Logger Formatters Definitions ---

[formatter_generic]
# Standardization of execution log outputs ensuring easy digestion by cloud log aggregators
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
