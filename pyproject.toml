# =============================================================================
# Unified Project Configuration Ledger & Dependency Architecture
# =============================================================================
# Role: Centralizes ecosystem metadata, precise environment constraints,
# requirements, and strict automated linting/formatting rules for the
# Smart City Cluj-Napoca AI-IoT Platform deployment pipeline.
# =============================================================================

[project]
name = "smart-city-cluj-napoca"
version = "0.1.0"
description = "IoT telemetry, real-time urban monitoring, ML, and LLMs platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.35",
    "streamlit-authenticator",
    "streamlit-autorefresh",
    "streamlit-folium",
    "pandas>=2.3",
    "numpy>=2.0",
    "plotly>=6.0",
    "folium>=0.20",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "sqlalchemy>=2.0",
    "alembic>=1.19",
    "aiosqlite>=0.22",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "statsmodels>=0.14",
    "prophet>=1.3",
    "fastapi>=0.135",
    "uvicorn[standard]>=0.42",
    "python-multipart>=0.0.27",
    "groq>=1.6",
    "google-genai>=1.73",
    "httpx>=0.28",
    "requests>=2.33",
    "aiohttp",
    "aiohttp-retry>=2.9",
    "python-dotenv>=1.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.0",
    "reportlab>=5.0",
    "xlsxwriter>=3.2",
    "pyjwt>=2.13",
    "cryptography>=47.0",
    "gitpython>=3.1",
    "greenlet>=3.5.6",
    "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.uv]
managed = true
# =============================================================================
# Ruff Tooling Configuration Layer
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Active Rule Systems:
# E/W = PEP8 errors and warnings
# F = Pyflakes (logic bugs & unused vars)
# I = Isort (clean automated import sorting)
# N = PEP8 Naming conventions enforcement
# D = Docstring style validations (PEP 257)
# UP = Pyupgrade (modernized Python 3.12 syntax optimizations)
# B = Bugbear (vulnerability anti-patterns detection)
select = ["E", "W", "F", "I", "N", "D", "UP", "B"]

# Preserved project-specific exemptions alongside architectural allowances
ignore = ["DTZ005", "N999", "BLE001", "S110"]

[tool.ruff.lint.pydocstyle]
# Enforces the professional Google Style guide for docstrings across all modules
convention = "google"

[tool.ruff.lint.isort]
# Combines identical structural module sub-elements cleanly
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
# Enforces industry standard formatting parameters uniformly
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# PyTest Execution Engine Environments
# =============================================================================
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ai_tests", "app", "src"]
python_files = ["test_*.py", "*_test.py"]
